name: Build YTMusicUltimate Download Fix

on:
  workflow_dispatch:

concurrency:
  group: ytm-download-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Download-Fixed IPA
    runs-on: macos-latest
    permissions:
      contents: write

    env:
      BASE_ASSET_ID: "506314675"
      BUNDLE_ID: "app.raspberry1880.gooseberry6361"
      APP_NAME: "YouTube Music"

    steps:
      - name: Checkout patched YTMusicUltimate source
        uses: actions/checkout@v6.0.2
        with:
          path: main
          submodules: recursive

      - name: Download previously built 9.26.2 IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${BASE_ASSET_ID}" \
            -o base.ipa
          unzip -tq base.ipa

      - name: Prepare the known-working clean base
        run: |
          rm -rf work
          mkdir work
          unzip -q base.ipa -d work

          python3 <<'PY'
          from pathlib import Path
          import shutil

          app = Path('work/Payload/YouTubeMusic.app')
          exe = app / 'YouTubeMusic'
          data = bytearray(exe.read_bytes())

          def replace_padded(old: str, new: str):
              global data
              old_b = old.encode()
              new_b = new.encode()
              if len(new_b) > len(old_b):
                  raise RuntimeError(f'Replacement too long: {new}')
              repl = new_b + b'\0' * (len(old_b) - len(new_b))
              count = data.count(old_b)
              if count:
                  data = data.replace(old_b, repl)
              print(f'{old}: replaced {count}')

          # This reproduces the clean-login build that already works on-device.
          replace_padded('@rpath/blatantsPatch.dylib', '@rpath/noPatch.dylib')
          replace_padded('@rpath/ReturnYouTubeMusicDislikes.dylib', '@rpath/noDislikes.dylib')
          replace_padded('@rpath/YTMusicUltimate.dylib', '@rpath/YTMDisabled.dylib')
          exe.write_bytes(data)

          for rel in [
              'Frameworks/blatantsPatch.dylib',
              'Frameworks/ReturnYouTubeMusicDislikes.dylib',
              'Frameworks/YTMusicUltimate.dylib',
              'Frameworks/CydiaSubstrate.framework',
              'YTMusicUltimate.bundle',
          ]:
              p = app / rel
              if p.is_dir():
                  shutil.rmtree(p, ignore_errors=True)
              elif p.exists():
                  p.unlink()

          for sig in app.rglob('_CodeSignature'):
              if sig.is_dir():
                  shutil.rmtree(sig, ignore_errors=True)
          PY

          cd work
          zip -qry ../cleanbase.ipa Payload
          cd ..
          unzip -tq cleanbase.ipa

      - name: Install build dependencies
        run: brew install make ldid

      - name: Set Theos environment
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      - name: Setup Theos
        uses: actions/checkout@v6.0.2
        with:
          repository: theos/theos
          ref: 9bc73406cf80b711ef4d02c15ff1dedc4478a275
          path: theos
          submodules: recursive

      - name: Download iOS SDK
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv *.sdk $THEOS/sdks

      - name: Clone required headers
        run: |
          cd $THEOS/include
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouTubeHeader.git
          git clone --quiet --depth=1 https://github.com/PoomSmart/PSHeader.git
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouTubeMusicHeader.git

      - name: Build patched YTMusicUltimate for sideloading
        run: |
          cd main
          make clean package DEBUG=0 FINALPACKAGE=1 SIDELOADING=1
          mv packages/*.deb ../ytmult-patched.deb

      - name: Install cyan injector
        run: pipx install --force https://github.com/asdfzxcvbn/pyzule-rw/archive/main.zip

      - name: Inject patched downloader and preserve AppTester bundle ID
        run: |
          cyan \
            -i cleanbase.ipa \
            -o YTMusicUltimate_9.26.2_PlayerCrashFix.ipa \
            -u -w -s -f ytmult-patched.deb \
            -n "$APP_NAME" \
            -b "$BUNDLE_ID" \
            --overwrite
          unzip -tq YTMusicUltimate_9.26.2_PlayerCrashFix.ipa

      - name: Verify final IPA
        run: |
          rm -rf verify
          unzip -q YTMusicUltimate_9.26.2_PlayerCrashFix.ipa -d verify
          python3 <<'PY'
          import plistlib
          from pathlib import Path

          app = Path('verify/Payload/YouTubeMusic.app')
          with open(app / 'Info.plist', 'rb') as f:
              info = plistlib.load(f)

          bundle = info.get('CFBundleIdentifier')
          print('Bundle ID:', bundle)
          if bundle != 'app.raspberry1880.gooseberry6361':
              raise SystemExit('Unexpected bundle ID')

          dylib = app / 'Frameworks/YTMusicUltimate.dylib'
          if not dylib.exists():
              raise SystemExit('Patched YTMusicUltimate.dylib was not injected')
          print('Patched dylib size:', dylib.stat().st_size)
          PY

      - name: Create draft release
        uses: softprops/action-gh-release@v2.5.0
        with:
          tag_name: player-crash-fix-${{ github.run_number }}
          name: YouTube Music 9.26.2 - Download Player Crash Fix
          files: YTMusicUltimate_9.26.2_PlayerCrashFix.ipa
          draft: true

      - name: Output release URL
        run: echo "::notice::Patched IPA available at https://github.com/${GITHUB_REPOSITORY}/releases"
