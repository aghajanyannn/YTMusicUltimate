name: Build YTMusicUltimate Download Fix

on:
  workflow_dispatch:

concurrency:
  group: ytm-download-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Download-Fixed IPA
    runs-on: macos-latest
    permissions:
      contents: write

    env:
      BASE_ASSET_ID: "506314675"
      BUNDLE_ID: "app.raspberry1880.gooseberry6361"
      APP_NAME: "YouTube Music"

    steps:
      - name: Checkout patched YTMusicUltimate source
        uses: actions/checkout@v6.0.2
        with:
          path: main
          submodules: recursive

      - name: Download known 9.26.2 base IPA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/assets/${BASE_ASSET_ID}" \
            -o base.ipa
          unzip -tq base.ipa

      - name: Prepare same clean base that worked on device
        run: |
          rm -rf work
          mkdir work
          unzip -q base.ipa -d work

          python3 <<'PY'
          from pathlib import Path

          app = Path('work/Payload/YouTubeMusic.app')
          exe = app / 'YouTubeMusic'
          data = bytearray(exe.read_bytes())

          def replace_all_padded(old: str, new: str):
              global data
              old_b = old.encode()
              new_b = new.encode()
              if len(new_b) > len(old_b):
                  raise RuntimeError(f'Replacement too long: {new}')
              repl = new_b + b'\0' * (len(old_b) - len(new_b))
              count = data.count(old_b)
              data = data.replace(old_b, repl)
              print(f'{old}: replaced {count}')
              return count

          def replace_occurrence_padded(old: str, new: str, occurrence: int):
              global data
              old_b = old.encode()
              new_b = new.encode()
              if len(new_b) > len(old_b):
                  raise RuntimeError(f'Replacement too long: {new}')
              positions = []
              start = 0
              while True:
                  pos = data.find(old_b, start)
                  if pos < 0:
                      break
                  positions.append(pos)
                  start = pos + len(old_b)
              print(f'{old}: found {len(positions)} occurrence(s)')
              if len(positions) <= occurrence:
                  raise RuntimeError(f'Expected at least {occurrence + 1} occurrences of {old}')
              pos = positions[occurrence]
              repl = new_b + b'\0' * (len(old_b) - len(new_b))
              data[pos:pos+len(old_b)] = repl

          # Match the Clean_LoginTest build that already opened and logged in.
          replace_all_padded('@rpath/blatantsPatch.dylib', '@rpath/noPatch.dylib')
          replace_all_padded('@rpath/ReturnYouTubeMusicDislikes.dylib', '@rpath/noDislikes.dylib')

          # The original input had YTMusicUltimate already, and the first GitHub
          # builder injected it a second time. Keep the FIRST real load command and
          # disable only the SECOND duplicate. Replacing both caused the DYLD
          # "duplicate linked dylib YTMDisabled.dylib" launch crash.
          replace_occurrence_padded('@rpath/YTMusicUltimate.dylib', '@rpath/YTMDisabled.dylib', 1)
          exe.write_bytes(data)

          # These two old tweaks conflicted with the sideload/login patch.
          for rel in [
              'Frameworks/blatantsPatch.dylib',
              'Frameworks/ReturnYouTubeMusicDislikes.dylib',
          ]:
              p = app / rel
              if p.exists():
                  p.unlink()

          # IMPORTANT: keep the existing YTMusicUltimate.dylib, its bundle, and
          # CydiaSubstrate.framework. We replace that dylib in-place later rather
          # than injecting another LC_LOAD_DYLIB command.
          PY

      - name: Install build dependencies
        run: brew install make ldid dpkg

      - name: Set Theos environment
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      - name: Setup Theos
        uses: actions/checkout@v6.0.2
        with:
          repository: theos/theos
          ref: 9bc73406cf80b711ef4d02c15ff1dedc4478a275
          path: theos
          submodules: recursive

      - name: Download iOS SDK
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mv *.sdk $THEOS/sdks

      - name: Clone required headers
        run: |
          cd $THEOS/include
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouTubeHeader.git
          git clone --quiet --depth=1 https://github.com/PoomSmart/PSHeader.git
          git clone --quiet --depth=1 https://github.com/PoomSmart/YouTubeMusicHeader.git

      - name: Build patched YTMusicUltimate for sideloading
        run: |
          cd main
          make clean package DEBUG=0 FINALPACKAGE=1 SIDELOADING=1
          mv packages/*.deb ../ytmult-patched.deb

      - name: Replace existing YTMusicUltimate with patched build
        run: |
          rm -rf package
          mkdir package
          dpkg-deb -x ytmult-patched.deb package

          DYLIB=$(find package -type f -name 'YTMusicUltimate.dylib' -print -quit)
          BUNDLE=$(find package -type d -name 'YTMusicUltimate.bundle' -print -quit)

          echo "Built dylib: $DYLIB"
          echo "Built bundle: $BUNDLE"
          test -n "$DYLIB"
          test -n "$BUNDLE"

          # Match the dependency layout used by sideloaded IPAs.
          install_name_tool -change \
            /Library/Frameworks/CydiaSubstrate.framework/CydiaSubstrate \
            @rpath/CydiaSubstrate.framework/CydiaSubstrate \
            "$DYLIB" || true

          APP='work/Payload/YouTubeMusic.app'
          cp -f "$DYLIB" "$APP/Frameworks/YTMusicUltimate.dylib"
          rm -rf "$APP/YTMusicUltimate.bundle"
          cp -R "$BUNDLE" "$APP/YTMusicUltimate.bundle"

          # Remove stale signatures. ESign will apply the real AppTester signature.
          find "$APP" -type d -name _CodeSignature -prune -exec rm -rf {} + || true

          cd work
          zip -qry ../YTMusicUltimate_9.26.2_PlayerCrashFix_v2.ipa Payload
          cd ..
          unzip -tq YTMusicUltimate_9.26.2_PlayerCrashFix_v2.ipa

      - name: Verify final IPA structure
        run: |
          rm -rf verify
          unzip -q YTMusicUltimate_9.26.2_PlayerCrashFix_v2.ipa -d verify
          python3 <<'PY'
          import plistlib
          from pathlib import Path

          app = Path('verify/Payload/YouTubeMusic.app')
          with open(app / 'Info.plist', 'rb') as f:
              info = plistlib.load(f)

          if info.get('CFBundleIdentifier') != 'app.raspberry1880.gooseberry6361':
              raise SystemExit('Unexpected bundle ID')

          exe = (app / 'YouTubeMusic').read_bytes()
          real = exe.count(b'@rpath/YTMusicUltimate.dylib')
          disabled = exe.count(b'@rpath/YTMDisabled.dylib')
          print('Real YTMusicUltimate loads:', real)
          print('Disabled duplicate loads:', disabled)
          if real != 1 or disabled != 1:
              raise SystemExit('Unexpected YTMusicUltimate load-command layout')

          dylib = app / 'Frameworks/YTMusicUltimate.dylib'
          if not dylib.exists():
              raise SystemExit('Patched YTMusicUltimate.dylib missing')
          print('Patched dylib size:', dylib.stat().st_size)
          PY

      - name: Create draft release
        uses: softprops/action-gh-release@v2.5.0
        with:
          tag_name: player-crash-fix-v2-${{ github.run_number }}
          name: YouTube Music 9.26.2 - Download Fix v2
          files: YTMusicUltimate_9.26.2_PlayerCrashFix_v2.ipa
          draft: true

      - name: Output release URL
        run: echo "::notice::Patched IPA available at https://github.com/${GITHUB_REPOSITORY}/releases"
